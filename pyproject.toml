[project]
name = "sob-harbor"
version = "2.0.0"
description = "SOB text tasks for schema-constrained, single-response Harbor evaluation"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0", "pyarrow==23.0.1"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor", "tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
